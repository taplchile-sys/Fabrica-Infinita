<script>
const $=s=>document.querySelector(s),W=24,H=28,DIR=[[0,-1],[1,0],[0,1],[-1,0]];
const RA=[{n:'Común',c:'#9aa0aa'},{n:'Poco común',c:'#3fbf55'},{n:'Raro',c:'#4a8cff'},{n:'Épico',c:'#b45aff'},{n:'Legendario',c:'#ffaa00'}];
const LVN=['Común','Poco común','Raro','Épico','Místico'],LVC=['#ffd24a','#ffb020','#ff7a1f','#ff4d4d','#ff3cf0'];
const EL=['Fuego','Agua','Tierra','Aire','Rayo'],EC=['#ff5a28','#3c8cff','#a8742f','#bfe3ff','#ffe632'];
const CVN=['Ácido','Óxido','Radiactivo'],CC=['#7dff3c','#ff8a3c','#d6ff00'];
const UT=['Multiplicador','Sumador','Elemental','Refinado','Incubadora','Corrosivo','Neutralizante'],UC=['#3c78c8','#3c9ec8','#9c5ac8','#c89c3c','#2fae86','#6ea82c','#c83c78'],SYM=['×','+','◆','♨','⌛','☢','✚'];
const f1=x=>x.toFixed(1),f2=x=>x.toFixed(2);
const SUF=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(!isFinite(n))return'0';if(n<1000)return n<10?n.toFixed(1):''+Math.floor(n);const e=Math.floor(Math.log10(n)/3);return e>SUF.length?n.toExponential(2):(n/1000**e).toFixed(2)+SUF[e-1]}
// z = tamaños [ancho, largo] que crecen con el nivel del objeto
const CATS={
DR:{l:'Dropper',n:280,col:'#6d6d78',z:[[1,1],[2,1],[2,2],[3,2],[3,3]],f:i=>({p:40*1.07**i,v:2*1.055**i,iv:Math.max(.4,3-i*.009)}),d:d=>'Valor '+fmt(d.v)+' · cada '+f1(d.iv)+'s · '+EL[d.el]},
UP:{l:'Upgrader',n:240,col:'#3c78c8',z:[[1,1],[1,2],[2,2],[2,3]],f:i=>{const y=i%7;return{p:100*1.065**i,sp:8,m:y===2?1.8+i*.03:y===3?2.2+i*.03:y===6?1.1+i*.004:1.15+i*.015,a:3*1.05**i,r:y===4?.15+i*.006:2+i*.03,cv:Math.floor(i/7)%3}},
 d:d=>['x'+f2(d.m),'+'+fmt(d.a)+' al valor','x'+f2(d.m)+' si coincide '+EL[d.el]+' (si no, x1.05)','x'+f2(d.m)+' solo si ya pasó por un horno (si no, x1.02)','+'+Math.round(d.r*100)+'%/s mientras está encima','+'+Math.round(d.r*100)+'%/s · corroe ('+CVN[d.cv]+'): destruye el drop en 3s','Quita corrosión '+CVN[d.cv]+' · x'+f2(d.m)][d.i%7]},
HO:{l:'Horno',n:180,col:'#c8502a',z:[[2,2],[2,3],[3,3]],f:i=>({p:250*1.07**i,m:2+i*.04,sp:8,pur:i%5===0}),d:d=>'Refina x'+f2(d.m)+' (x1.5 con '+EL[d.el]+')'+(d.pur?' · purifica corrosión':'')},
CI:{l:'Cinta',n:100,col:'#3a3a40',z:[[1,1],[1,2],[1,3]],f:i=>({p:20*1.05**i,sp:6+i*.1}),d:d=>'Velocidad '+f1(d.sp)},
BA:{l:'Barrera',n:50,col:'#a09a3c',z:[[1,1],[2,1],[3,1],[4,1]],f:i=>({p:30*1.04**i}),d:()=>'Bloquea el paso'},
TP:{l:'Teletransp.',n:40,col:'#963cc8',z:[[1,1],[2,2]],f:i=>({p:150*1.06**i,cd:Math.max(.3,2-i*.04),sp:6}),d:d=>'Se enlaza por pares (en orden de colocación)'},
PU:{l:'Compuerta',n:40,col:'#3ca06e',z:[[1,1],[2,1],[3,1]],f:i=>({p:60*1.05**i,sp:6,trap:i%2===1}),d:d=>(d.trap?'Atrapa los drops':'Detiene los drops')+' al cerrar · toca su botón'},
IN:{l:'Inversor',n:30,col:'#dc8c28',z:[[1,1],[2,1]],f:i=>({p:80*1.06**i,sp:6+i*.2}),d:()=>'Toca su botón para invertir el sentido'},
RD:{l:'Radar',n:40,col:'#2a8a9a',z:[[1,1],[2,2]],f:i=>({p:60*1.06**i,sp:6+i*.1}),d:()=>'Muestra valor y corrosión de cada drop'}};
const ORDER=Object.keys(CATS),MOV={UP:1,HO:1,CI:1,TP:1,IN:1,RD:1};
const MATS='Cobre,Hierro,Estaño,Bronce,Plata,Oro,Platino,Cobalto,Níquel,Zinc,Titanio,Cuarzo,Jade,Rubí,Zafiro,Esmeralda,Ónix,Obsidiana,Diamante,Mithril'.split(',');
const ID={},BY={},RB=[[],[],[],[],[]],LB=[[],[],[],[],[]];let TOTAL=0;
for(const k of ORDER){const c=CATS[k];BY[k]=[];for(let i=1;i<=c.n;i++){const q=i/c.n,r=q<=.3?0:q<=.55?1:q<=.75?2:q<=.9?3:4,d=c.f(i),zz=c.z[Math.min(c.z.length-1,Math.floor(q*c.z.length-1e-9))];
d.id=k+String(i).padStart(3,'0');d.k=k;d.i=i;d.r=r;d.w=zz[0];d.h=zz[1];d.el=i%5;d.name=(k==='UP'?UT[i%7]:k==='PU'&&d.trap?'Trampa':c.l)+' '+MATS[(i-1)%20]+' Mk'+Math.ceil(i/20);
if(r===4){const b0=Math.round(.9*c.n);d.lv=Math.min(4,Math.floor((i-b0-1)/(c.n-b0)*5))}d.p=r<4?Math.floor(d.p):null;d.desc=c.d(d)+' · '+d.w+'×'+d.h;ID[d.id]=d;BY[k].push(d);if(r<4)RB[r].push(d);else LB[d.lv].push(d);TOTAL++}}
const GROUPS=[{n:'Droppers',s:[{l:'',a:BY.DR}]},{n:'Upgraders',s:UT.map((u,j)=>({l:u,a:BY.UP.filter(d=>d.i%7===j)}))},{n:'Hornos',s:[{l:'',a:BY.HO}]},
{n:'Cintas',s:['CI','BA','TP','PU','IN'].map(k=>({l:CATS[k].l,a:BY[k]}))},{n:'Radar',s:[{l:'',a:BY.RD}]},{n:'Cofres',ch:1,s:[{l:'',a:[]}]}];
// prestigios
const cost=p=>20000*2.4**(p-1),mult=p=>1+.2*p,cap=()=>100+5*S.p,mcap=()=>120+10*S.p;
function odds(p){const t=p/100,a=[50,28,14,6,2],b=[10,25,30,25,10];return a.map((x,i)=>(x*(1-t)+b[i]*t)/100)}
function roll(p){const out=[],o=odds(p),n=1+Math.floor(p/10);for(let r=0;r<n;r++){let x=Math.random(),a=0,v=4;for(let i=0;i<5;i++){a+=o[i];if(x<=a){v=i;break}}if(p%10===0&&r===0)v=Math.random()<.2?4:3;const l=LB[v];out.push(l[Math.floor(Math.random()*l.length)].id)}return out}
// estado
let S={m:150,p:0,inv:{},col:{},lay:{}},slot=1,G=new Array(W*H).fill(null),T=[],ores=[],fl=[],uid=0,mode=null,sel=null,rot=0,hov=null,down=false,lastC=-1,grp=0,sub=0,panel=null,arm=0,tt=0,acc=0,ips=0,errs=0,errT=0;
const isCol=(x,y)=>y===H-1&&x>=10&&x<=13;
const dims=(id,r)=>r%2?[ID[id].h,ID[id].w]:[ID[id].w,ID[id].h];
function fits(id,x,y,r){const[cw,ch]=dims(id,r);if(x<0||y<0||x+cw>W||y+ch>H)return false;for(let j=y;j<y+ch;j++)for(let i=x;i<x+cw;i++)if(G[j*W+i]||isCol(i,j))return false;return true}
function mkT(id,x,y,r,dir,open){const d=ID[id],[cw,ch]=dims(id,r),t={id,k:d.k,x,y,rot:r,cw,ch,dir:dir||1,open:open!==0,uid:++uid,t:0,cd:0,last:0};T.push(t);for(let j=y;j<y+ch;j++)for(let i=x;i<x+cw;i++)G[j*W+i]=t;return t}
function rem(t){T=T.filter(a=>a!==t);for(let j=t.y;j<t.y+t.ch;j++)for(let i=t.x;i<t.x+t.cw;i++)if(G[j*W+i]===t)G[j*W+i]=null}
// auto-reparación: corrige estados inválidos sin perder progreso
function heal(){S.lay=S.lay&&typeof S.lay==='object'?S.lay:{};if(!isFinite(S.m)||S.m<0)S.m=0;if(!isFinite(S.p)||S.p<0)S.p=0;S.p=Math.min(100,Math.floor(S.p));
for(const k in S.inv)if(!ID[k]||!(S.inv[k]>0)||!isFinite(S.inv[k]))delete S.inv[k];
ores=ores.filter(o=>isFinite(o.x+o.y+o.v)&&o.v>=0);fl=fl.filter(f=>isFinite(f.x+f.y));
const old=T;T=[];G.fill(null);for(const t of old)if(ID[t.id]&&fits(t.id,t.x,t.y,t.rot))mkT(t.id,t.x,t.y,t.rot,t.dir,t.open?1:0);else if(ID[t.id])S.inv[t.id]=(S.inv[t.id]||0)+1}
function fixed(){if(Date.now()-errT>5000){errT=Date.now();toast('Se detectó un error y se corrigió automáticamente')}}
function loadD(d,off){try{if(!d)return;S.lay=d.lay||{};S.m=+d.m||0;S.p=+d.p||0;S.inv=d.inv||{};(d.col||[]).forEach(i=>S.col[i]=1);
for(const a of d.t||[]){const[id,x,y,r,dr,op]=a;if(!ID[id])continue;if(fits(id,x,y,r))mkT(id,x,y,r,dr,op);else S.inv[id]=(S.inv[id]||0)+1}
if(off&&d.ts&&d.ips>0){const s=Math.min(7200,(Date.now()-d.ts)/1000);if(s>60){const g=d.ips*s*.5;S.m+=g;setTimeout(()=>toast('Ganaste $'+fmt(g)+' mientras no estabas'),600)}}}catch(e){}heal()}
function snap(){return{m:S.m,p:S.p,inv:S.inv,col:Object.keys(S.col),ts:Date.now(),ips,lay:S.lay,t:lay()}}
function save(){try{localStorage.setItem('fi3_'+slot,JSON.stringify(snap()));localStorage.setItem('fi3_a',slot)}catch(e){}}
function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2800)}
const pf=(x,y,s)=>{fl.push({x,y,s,t:1});if(fl.length>40)fl.shift()};
const blk=(x,y)=>{if(x<0||y<0||x>=W||y>=H)return true;const t=G[y*W+x];return!!t&&(t.k==='BA'||(t.k==='PU'&&!t.open&&!ID[t.id].trap))};
// simulación
function upd(dt){const tp=[];
for(const t of T){const d=ID[t.id];
if(t.k==='DR'){t.t+=dt;if(t.t>=d.iv){t.t=0;if(ores.length<cap()){const f=[[t.x+t.cw/2,t.y-.5],[t.x+t.cw+.5,t.y+t.ch/2],[t.x+t.cw/2,t.y+t.ch+.5],[t.x-.5,t.y+t.ch/2]][t.rot],j=(Math.random()-.5)*.2;
if(!blk(Math.floor(f[0]),Math.floor(f[1])))ores.push({x:f[0]+(t.rot%2?0:j),y:f[1]+(t.rot%2?j:0),v:d.v,el:d.el,rf:0,seen:{},tp:0,age:0,cor:null,rd:0})}}}
else if(t.k==='TP'){t.cd-=dt;tp.push(t)}}
tp.sort((a,b)=>a.uid-b.uid);
for(let j=ores.length-1;j>=0;j--){const o=ores[j];o.age+=dt;o.tp-=dt;o.rd-=dt;
if(o.cor){o.cor.t-=dt;if(o.cor.t<=0){pf(o.x,o.y,'✖ corroído');ores.splice(j,1);continue}}
const gx=Math.floor(o.x),gy=Math.floor(o.y);
if(o.age>45||gx<0||gy<0||gx>=W||gy>=H){ores.splice(j,1);continue}
if(isCol(gx,gy)){const g=o.v*mult(S.p);S.m+=g;acc+=g;pf(o.x,o.y,'+$'+fmt(g));ores.splice(j,1);continue}
const t=G[gy*W+gx];if(!t)continue;const d=ID[t.id],k=t.k,once=!o.seen[t.uid];
if(k==='UP'){const y=d.i%7;
if(y===4||y===5){o.v*=1+d.r*dt;if(y===5&&!o.cor)o.cor={v:d.cv,t:3}}
else if(once){o.seen[t.uid]=1;if(y===0)o.v*=d.m;else if(y===1)o.v+=d.a;else if(y===2)o.v*=o.el===d.el?d.m:1.05;else if(y===3)o.v*=o.rf?d.m:1.02;else if(o.cor&&o.cor.v===d.cv){o.cor=null;o.v*=d.m}}}
else if(k==='HO'&&once){o.seen[t.uid]=1;if(!o.rf){o.rf=1;o.v*=d.m*(o.el===d.el?1.5:1)}if(d.pur)o.cor=null}
else if(k==='RD'){o.rd=1;t.last=o.v}
else if(k==='TP'&&o.tp<=0&&t.cd<=0){const i=tp.indexOf(t),q=tp[i%2?i-1:i+1];if(q){t.cd=d.cd;o.x=q.x+q.cw/2;o.y=q.y+q.ch/2;o.tp=1.2;continue}}
if(k==='PU'){o.age=0;if(!t.open)continue}
if(!(MOV[k]||k==='PU'))continue;
const dx=DIR[t.rot][0]*t.dir,dy=DIR[t.rot][1]*t.dir,s=(d.sp||6)*.5*dt,nx=o.x+dx*s,ny=o.y+dy*s,ncx=Math.floor(nx),ncy=Math.floor(ny);
if((ncx!==gx||ncy!==gy)&&blk(ncx,ncy)){o.age=0;continue}
o.x=nx;o.y=ny;if((dx===0?t.cw:t.ch)===1){const kk=Math.min(1,8*dt);if(dx===0)o.x+=(gx+.5-o.x)*kk;else o.y+=(gy+.5-o.y)*kk}}
for(const f of fl)f.t-=dt*.8;fl=fl.filter(f=>f.t>0)}
// dibujo
const cv=$('#cv'),X=cv.getContext('2d');let cs=15,px=0,py=0,z=1,bc=15,RW=300,RH=400,C={ln:'#ccc',fl:'#eee'};
function th(){const s=getComputedStyle(document.documentElement);C.ln=s.getPropertyValue('--ln');C.fl=s.getPropertyValue('--fl')}
function clampCam(){const gw=W*cs,gh=H*cs;px=gw<=RW?(RW-gw)/2:Math.min(0,Math.max(RW-gw,px));py=gh<=RH?(RH-gh)/2:Math.min(0,Math.max(RH-gh,py))}
function resize(){const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;RW=r.width;RH=r.height;cv.width=RW*dp;cv.height=RH*dp;X.setTransform(dp,0,0,dp,0,0);bc=Math.min(RW/W,RH/H);cs=bc*z;clampCam();th()}
function zoomAt(f,mx,my){const nz=Math.min(6,Math.max(1,z*f));f=nz/z;z=nz;px=mx-(mx-px)*f;py=my-(my-py)*f;cs=bc*z;clampCam()}
addEventListener('resize',resize);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',th);
function rr(x,y,w,h,r){X.beginPath();X.roundRect?X.roundRect(x,y,w,h,r):X.rect(x,y,w,h)}
function drawT(t,tm,gh,ok){const d=ID[t.id],k=t.k,lw=(t.rot%2?t.ch:t.cw)*cs,lh=(t.rot%2?t.cw:t.ch)*cs,m=Math.min(lw,lh),sx=px+(t.x+t.cw/2)*cs,sy=py+(t.y+t.ch/2)*cs;
X.save();X.translate(sx,sy);X.rotate(t.rot*Math.PI/2);X.globalAlpha=gh?.6:1;
X.fillStyle=gh?(ok?'#2fd36b':'#ff4040'):k==='UP'?UC[d.i%7]:CATS[k].col;rr(-lw/2+.5,-lh/2+.5,lw-1,lh-1,Math.min(4,cs/3));X.fill();
if(MOV[k]||(k==='PU'&&t.open)){X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=Math.max(1,cs*.08);const sp=cs*.6,off=tm*.001*(d.sp||6)*.5*cs*t.dir,s=Math.min(lw/2-2,cs*.28),q=t.dir;
for(let a=0;a<lh;a+=sp){const y=((a-off)%lh+lh)%lh-lh/2;X.beginPath();X.moveTo(-s,y+s*.5*q);X.lineTo(0,y-s*.5*q);X.lineTo(s,y+s*.5*q);X.stroke()}}
